name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual triggering

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: win-x64
            runner: windows-latest
            artifact-name: WRFrontiersDB-CUE4Parse-windows-x64
            executable-extension: .exe
          - os: linux-x64
            runner: ubuntu-latest
            artifact-name: WRFrontiersDB-CUE4Parse-linux-x64
            executable-extension: ''

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore WRFrontiersDB-CUE4Parse.sln

    - name: Build application
      run: |
        dotnet publish src/WRFrontiersDB-CUE4Parse.csproj --configuration Release --runtime ${{ matrix.os }} --self-contained true --output ./publish/${{ matrix.os }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

    - name: Add Linux native libraries
      if: matrix.os == 'linux-x64'
      run: scripts/fetch-linux-natives.sh ./publish/${{ matrix.os }}

    - name: Add Windows native libraries
      if: matrix.os == 'win-x64'
      shell: bash
      run: scripts/fetch-windows-natives.sh ./publish/${{ matrix.os }}

    - name: Create archive (Windows)
      if: matrix.os == 'win-x64'
      run: |
        Compress-Archive -Path ./publish/${{ matrix.os }}/* -DestinationPath ${{ matrix.artifact-name }}.zip

    - name: Create archive (Linux)
      if: matrix.os == 'linux-x64'
      run: |
        cd ./publish/${{ matrix.os }}
        zip -r ../../${{ matrix.artifact-name }}.zip *

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          ${{ matrix.artifact-name }}.zip
        retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for changelog
        submodules: recursive

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
        else
          CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges)
        fi
        
        # Create release notes
        cat << EOF > RELEASE_NOTES.md
        ## What's New in ${{ steps.version.outputs.version }}
        
        ### Changes
        $CHANGELOG
        
        ### Downloads
        - **Windows (x64)**: WRFrontiersDB-CUE4Parse-windows-x64.zip
        - **Linux (x64)**: WRFrontiersDB-CUE4Parse-linux-x64.zip
        
        ### Usage
        Extract the archive and run:
        \`\`\`bash
        # Windows
        WRFrontiersDB-CUE4Parse.exe --help

        # Linux
        ./WRFrontiersDB-CUE4Parse --help
        \`\`\`
        
        ### Quick Start
        \`\`\`bash
        # Windows
        WRFrontiersDB-CUE4Parse.exe ^
          --pak-files-directory "C:\\Game\\Paks" ^
          --export-output-path "C:\\Export" ^
          --mapping-file-path "C:\\mappings.usmap"

        # Linux
        ./WRFrontiersDB-CUE4Parse \\
          --pak-files-directory "/path/to/paks" \\
          --export-output-path "/path/to/export" \\
          --mapping-file-path "/path/to/mappings.usmap"
        \`\`\`
        EOF

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find ./artifacts -name "*.zip" | while read file; do
          cp "$file" release-assets/
        done
        # Include README.md in the release assets
        cp README.md release-assets/
        ls -la release-assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        files: release-assets/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}